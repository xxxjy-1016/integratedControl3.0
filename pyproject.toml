[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "integrated-control"
version = "0.1.0"
description = "PC control application for the integrated coating workstation"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
hardware = ["pyserial>=3.5"]

[project.scripts]
integrated-control = "integrated_control.app:main"
integrated-control-debug = "integrated_control.diagnostics_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
